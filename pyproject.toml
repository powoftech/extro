[project]
name = "extro"
version = "0.1.0"
description = "Firefox profile data extraction CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "browsercookie>=0.8.2",
  "curl-cffi>=0.15.0",
  "keyring>=25.7.0",
  "platformdirs>=4.9.6",
  "pydantic>=2.13.4",
  "questionary>=2.1.1",
  "rich>=15.0.0",
  "selenium>=4.44.0",
  "sqlalchemy>=2.0.49",
  "typer>=0.25.1",
]

[project.scripts]
extro = "extro.main:app"

[dependency-groups]
dev = [
  "mypy>=2.1.0",
  "pyinstaller>=6.13.0",
  "pytest>=9.0.3",
  "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extro"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src,typings"
strict = true
pretty = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["questionary", "questionary.*", "platformdirs"]
ignore_missing_imports = true

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "TC",
  "TD",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"alembic/**/*.py" = ["INP001"]

[tool.uv]
package = true
