[project]
name = "extro"
version = "0.1.0"
description = "Firefox profile data extraction CLI tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "browsercookie>=0.8.2",
  "curl-cffi>=0.15.0",
  "keyring>=25.7.0",
  "platformdirs>=4.9.6",
  "pydantic>=2.13.4",
  "questionary>=2.1.1",
  "rich>=15.0.0",
  "selenium>=4.44.0",
  "sqlalchemy>=2.0.49",
  "typer>=0.25.1",
]

[project.scripts]
extro = "extro.main:app"

[dependency-groups]
dev = [
  "pyright[nodejs]>=1.1.409",
  # "pytest>=9.0.3",
  "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extro"]

[tool.pyright]
strict = ["./src"]
include = ["./src"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "**/.*"]
typeCheckingMode = "strict"
stubPath = "./typings"
pythonVersion = "3.14"
pythonPlatform = "Linux"
verboseOutput = true

# [tool.pytest]
# pythonpath = ["src"]
# testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
exclude = ["typings"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "TC",
  "TD",
  "TID",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"alembic/**/*.py" = ["INP001"]

[tool.uv]
package = true
