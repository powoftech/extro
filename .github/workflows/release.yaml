name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required to create GitHub Releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Build binaries on each native platform
  # --------------------------------------------------------------------------
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            target: windows-x64
            binary_name: extro-windows-x64.exe
            pyinstaller_args: "--onefile --name extro-windows-x64"

          # Linux x64
          - os: ubuntu-latest
            arch: x64
            target: linux-x64
            binary_name: extro-linux-x64
            pyinstaller_args: "--onefile --name extro-linux-x64"

          # Linux ARM64 (GitHub-hosted native ARM runner)
          - os: ubuntu-24.04-arm
            arch: arm64
            target: linux-arm64
            binary_name: extro-linux-arm64
            pyinstaller_args: "--onefile --name extro-linux-arm64"

          # macOS x64 (Intel)
          - os: macos-13
            arch: x64
            target: macos-x64
            binary_name: extro-macos-x64
            pyinstaller_args: "--onefile --name extro-macos-x64"

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            target: macos-arm64
            binary_name: extro-macos-arm64
            pyinstaller_args: "--onefile --name extro-macos-arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies (including dev for PyInstaller)
        run: uv sync --all-groups

      - name: Build binary with PyInstaller
        run: >
          uv run pyinstaller
          ${{ matrix.pyinstaller_args }}
          --clean
          --strip
          src/extro/main.py

      - name: Verify binary runs (Unix)
        if: runner.os != 'Windows'
        run: ./dist/${{ matrix.binary_name }} --version

      - name: Verify binary runs (Windows)
        if: runner.os == 'Windows'
        run: .\dist\${{ matrix.binary_name }} --version

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.binary_name }}
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # Collect all binaries and publish the GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
